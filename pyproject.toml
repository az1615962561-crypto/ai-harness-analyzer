[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-analyzer"
version = "0.1.0"
description = "AI Harness Architecture Analyzer - 分析 AI 应用背后的 Harness 架构"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
harness = "harness_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_analyzer"]
